name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cat_game
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cat_game
      RUN_DOCKER_GRADING_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: cp alembic.ini.example alembic.ini
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: docker build -t cat-game-python-grader:3.12 infra/docker/grader
      - run: pytest
      - run: ruff check .
