services:
  sql-grader-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sql_grader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-bootstrap-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grader_admin -d sql_grader"]
      interval: 2s
      timeout: 2s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./sql-grader-init.sql:/docker-entrypoint-initdb.d/sql-grader-init.sql:ro
